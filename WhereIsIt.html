<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhereIsIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:          #f5f6f8;
      --surface:     #ffffff;
      --border:      #e2e4e9;
      --text:        #1c1c1e;
      --text-muted:  #6b7280;
      --shadow:      0 1px 4px rgba(0,0,0,.08);
      --loc-a:       #1a2e4a;
      --loc-a-light: #e8edf5;
      --loc-b:       #c0394b;
      --loc-b-light: #faeaec;
      --accent:      #1a2e4a;
      --radius:      10px;
      --radius-sm:   6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    input, select, textarea { font-family: inherit; }

    /* Icon system — all SVGs are 16x16 by default, stroke-width 1.75 */
    .ic { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ic-sm svg { width: 13px; height: 13px; }
    .ic-lg svg { width: 28px; height: 28px; stroke-width: 1.5; }
    .ic-xl svg { width: 44px; height: 44px; stroke-width: 1.25; }

    /* Topbar */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo { font-size: 1.15rem; font-weight: 700; letter-spacing: -.5px; }
    .topbar-logo span { color: var(--loc-a); }
    .topbar-actions { display: flex; gap: .5rem; align-items: center; }

    /* Toolbar */
    .toolbar { padding: 1rem 1.5rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-wrap .search-icon {
      position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }
    .search-input {
      width: 100%; padding: .55rem .75rem .55rem 2.2rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: .9rem; background: var(--surface); color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .filter-select {
      padding: .55rem .75rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: .9rem;
      background: var(--surface); color: var(--text); outline: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1rem; border-radius: var(--radius-sm);
      font-size: .9rem; font-weight: 500;
      transition: opacity .15s, background .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-sm { padding: .35rem .7rem; font-size: .82rem; }
    .btn .ic svg { width: 14px; height: 14px; }

    /* Icon buttons */
    .icon-btn {
      width: 28px; height: 28px; border-radius: var(--radius-sm);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg); color: var(--text); }
    .icon-btn.pack-active { color: var(--loc-a); }
    .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    /* Pack banner */
    .pack-banner {
      margin: 0 1.5rem .5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .75rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: .5rem; flex-wrap: wrap;
    }
    .pack-banner-title { font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: .5rem; }
    .pack-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 5px;
      background: var(--loc-b); color: #fff;
      border-radius: 99px; font-size: .72rem; font-weight: 700;
    }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; padding: 0 1.5rem 2rem; }

    /* Card */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }

    .card-img {
      width: 100%; height: 150px; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: .85rem; flex: 1; display: flex; flex-direction: column; gap: .4rem; }
    .card-name { font-weight: 600; font-size: .95rem; }
    .card-note { font-size: .82rem; color: var(--text-muted); flex: 1; }
    .card-footer {
      padding: .6rem .85rem; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    }

    /* Tags */
    .tag {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .2rem .55rem; border-radius: 99px; font-size: .74rem; font-weight: 500;
    }
    .tag svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .tag-loc-a { background: var(--loc-a-light); color: var(--loc-a); }
    .tag-loc-b { background: var(--loc-b-light); color: var(--loc-b); }
    .tag-cat   { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
    .card-actions { display: flex; gap: .35rem; }

    /* Empty state */
    .empty { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-icon { display: flex; justify-content: center; margin-bottom: .75rem; color: var(--border); }
    .empty h3 { font-size: 1.05rem; color: var(--text); margin-bottom: .35rem; }
    .empty p { font-size: .875rem; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: var(--radius);
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
      transform: translateY(12px); transition: transform .2s;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.05rem; font-weight: 700; }
    .modal-close {
      width: 30px; height: 30px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted);
    }
    .modal-close:hover { background: var(--bg); }
    .modal-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .modal-footer { display: flex; gap: .5rem; justify-content: flex-end; }

    /* Form */
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-label { font-size: .84rem; font-weight: 500; }
    .form-input, .form-select, .form-textarea {
      padding: .6rem .75rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: .9rem;
      color: var(--text); background: var(--surface); outline: none; transition: border-color .15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: flex; gap: .75rem; }
    .form-row .form-group { flex: 1; }

    /* Image upload */
    .img-preview {
      width: 100%; height: 140px;
      border: 2px dashed var(--border); border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .4rem; color: var(--text-muted); font-size: .84rem;
      cursor: pointer; overflow: hidden; position: relative; background: var(--bg);
    }
    .img-preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-preview input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .img-preview svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Pack list in modal */
    .pack-list { display: flex; flex-direction: column; gap: .5rem; max-height: 50vh; overflow-y: auto; }
    .pack-item {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem .75rem; background: var(--bg); border-radius: var(--radius-sm);
    }
    .pack-item-icon { color: var(--text-muted); display: flex; }
    .pack-item-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .pack-item-name { font-weight: 500; font-size: .9rem; flex: 1; }
    .pack-item-loc { font-size: .8rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .toolbar, .grid { padding-left: 1rem; padding-right: 1rem; }
      .pack-banner { margin-left: 1rem; margin-right: 1rem; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-logo">Where<span>Is</span>It</div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="openPackingBtn">
      <span class="ic">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      </span>
      Inpaklijst
      <span class="pack-count" id="packCount">0</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="openSettingsBtn" title="Instellingen">
      <span class="ic">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
    </button>
    <button class="btn btn-primary btn-sm" id="openAddBtn">
      <span class="ic">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
      Item
    </button>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon ic">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input class="search-input" id="searchInput" type="search" placeholder="Zoek een item..." />
  </div>
  <select class="filter-select" id="filterLoc"></select>
  <select class="filter-select" id="filterCat">
    <option value="">Alle categorieën</option>
  </select>
</div>

<!-- PACK BANNER -->
<div class="pack-banner" id="packBanner" style="display:none">
  <span class="pack-banner-title">
    <span class="ic">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    </span>
    Inpaklijst actief
  </span>
  <div style="display:flex;gap:.5rem">
    <button class="btn btn-ghost btn-sm" id="openPackingBtn2">Bekijken</button>
    <button class="btn btn-ghost btn-sm" id="clearPackBtn">Leegmaken</button>
  </div>
</div>

<!-- ITEM GRID -->
<div class="grid" id="itemGrid"></div>

<!-- MODAL: ITEM TOEVOEGEN / BEWERKEN -->
<div class="modal-backdrop" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="itemModalTitle">Item toevoegen</span>
      <button class="modal-close" id="itemModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="form-group">
      <label class="form-label">Naam</label>
      <input class="form-input" id="fName" placeholder="Bijv. Voetbalschoenen" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Locatie</label>
        <select class="form-select" id="fLoc"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Categorie</label>
        <select class="form-select" id="fCat">
          <option>Kleding</option><option>Elektronica</option><option>Sport</option>
          <option>School</option><option>Persoonlijk</option><option>Overig</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notitie (optioneel)</label>
      <textarea class="form-textarea" id="fNote" placeholder="Extra informatie..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Foto (optioneel)</label>
      <div class="img-preview" id="imgPreview">
        <svg id="imgPlaceholderIcon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span id="imgPlaceholderText">Klik om foto toe te voegen</span>
        <img id="imgPreviewImg" src="" style="display:none" alt="preview" />
        <input type="file" accept="image/*" id="fImg" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="itemModalCancel">Annuleren</button>
      <button class="btn btn-primary" id="itemModalSave">Opslaan</button>
    </div>
  </div>
</div>

<!-- MODAL: VERWIJDER BEVESTIGING -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <span class="modal-title">Item verwijderen</span>
      <button class="modal-close" id="deleteModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:.9rem;color:var(--text-muted)">Weet je zeker dat je <strong id="deleteItemName"></strong> wil verwijderen? Dit kan niet ongedaan worden gemaakt.</p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="deleteCancelBtn">Annuleren</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">Verwijderen</button>
    </div>
  </div>
</div>

<!-- MODAL: INPAKLIJST -->
<div class="modal-backdrop" id="packModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Inpaklijst</span>
      <button class="modal-close" id="packModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:.85rem;color:var(--text-muted)">Items die je wil meenemen bij je volgende verhuizing.</p>
    <div class="pack-list" id="packList"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="clearPackBtn2">Lijst leegmaken</button>
      <button class="btn btn-primary" id="packModalClose2">Sluiten</button>
    </div>
  </div>
</div>

<!-- MODAL: INSTELLINGEN -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Instellingen</span>
      <button class="modal-close" id="settingsModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:.84rem;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em">Locatienamen</p>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Locatie A</label>
        <input class="form-input" id="sLocA" placeholder="Papa" />
      </div>
      <div class="form-group">
        <label class="form-label">Locatie B</label>
        <input class="form-input" id="sLocB" placeholder="Mama" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="settingsCancel">Annuleren</button>
      <button class="btn btn-primary" id="settingsSave">Opslaan</button>
    </div>
  </div>
</div>

<script>
// ── SVG ICON LIBRARY ──
// Centraal punt voor alle iconen — pas hier aan om iconen site-breed te wijzigen.
const ICONS = {
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  plus:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  close:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  edit:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  trash:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
  package:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,

  mappin:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  tag:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  inbox:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
  shirt:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>`,
  monitor:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
  activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  book:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  user:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  box:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
  image:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
};

const CAT_ICONS = {
  Kleding: 'shirt', Elektronica: 'monitor', Sport: 'activity',
  School: 'book', Persoonlijk: 'user', Overig: 'box'
};

function ic(name, size) {
  const svg = ICONS[name] || ICONS.box;
  return `<span class="ic${size ? ' ic-'+size : ''}">${svg}</span>`;
}

// ── STATE ──
const DEFAULT_SETTINGS = { locA: 'Papa', locB: 'Mama' };
let items    = JSON.parse(localStorage.getItem('wii_items')    || '[]');
let packList = JSON.parse(localStorage.getItem('wii_pack')     || '[]');
let settings = JSON.parse(localStorage.getItem('wii_settings') || JSON.stringify(DEFAULT_SETTINGS));
let editingId = null, deletingId = null, imgData = null;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function save() {
  localStorage.setItem('wii_items',    JSON.stringify(items));
  localStorage.setItem('wii_pack',     JSON.stringify(packList));
  localStorage.setItem('wii_settings', JSON.stringify(settings));
}
function locName(k) { return k === 'a' ? settings.locA : settings.locB; }

// ── RENDER ──
function applySettings() {
  const opts = `<option value="">Alle locaties</option><option value="a">${settings.locA}</option><option value="b">${settings.locB}</option>`;
  $('filterLoc').innerHTML = opts;
  $('fLoc').innerHTML = `<option value="a">${settings.locA}</option><option value="b">${settings.locB}</option>`;
}

function buildCatFilter() {
  const used = [...new Set(items.map(i => i.cat))];
  const cur = $('filterCat').value;
  $('filterCat').innerHTML = '<option value="">Alle categorieën</option>' +
    used.map(c => `<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
}

function render() {
  applySettings();
  buildCatFilter();

  const q   = $('searchInput').value.toLowerCase();
  const loc = $('filterLoc').value;
  const cat = $('filterCat').value;

  const filtered = items.filter(item =>
    (!q   || item.name.toLowerCase().includes(q) || (item.note||'').toLowerCase().includes(q)) &&
    (!loc || item.loc === loc) &&
    (!cat || item.cat === cat)
  );

  const grid = $('itemGrid');

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">${ic('inbox','xl')}</div>
      <h3>${items.length ? 'Geen items gevonden' : 'Nog geen items'}</h3>
      <p>${items.length ? 'Pas je zoekopdracht of filters aan.' : 'Voeg je eerste item toe via de knop rechtsboven.'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const inPack = packList.includes(item.id);
    const locCls = item.loc === 'a' ? 'tag-loc-a' : 'tag-loc-b';
    const catIconName = CAT_ICONS[item.cat] || 'box';
    const imgHTML = item.img
      ? `<div class="card-img"><img src="${item.img}" alt="${item.name}" /></div>`
      : `<div class="card-img">${ic(catIconName,'lg')}</div>`;

    return `<div class="card">
      ${imgHTML}
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        ${item.note ? `<div class="card-note">${item.note}</div>` : ''}
      </div>
      <div class="card-footer">
        <div style="display:flex;gap:.35rem;flex-wrap:wrap">
          <span class="tag ${locCls}">${ic('mappin','sm')} ${locName(item.loc)}</span>
          <span class="tag tag-cat">${ic(catIconName,'sm')} ${item.cat}</span>
        </div>
        <div class="card-actions">
          <button class="icon-btn${inPack?' pack-active':''}" title="Inpaklijst" onclick="togglePack('${item.id}')">${ICONS.package}</button>
          <button class="icon-btn" title="Bewerken" onclick="openEdit('${item.id}')">${ICONS.edit}</button>
          <button class="icon-btn" title="Verwijderen" onclick="openDelete('${item.id}')">${ICONS.trash}</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $('packCount').textContent = packList.length;
  $('packBanner').style.display = packList.length ? 'flex' : 'none';
}

// ── MODALS ──
function openModal(id)  { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(el =>
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); })
);

// ── ADD / EDIT ──
function openAdd() {
  editingId = null; imgData = null;
  $('itemModalTitle').textContent = 'Item toevoegen';
  ['fName','fNote'].forEach(id => $(id).value = '');
  $('fLoc').value = 'a'; $('fCat').value = 'Kleding';
  $('imgPreviewImg').style.display = 'none';
  $('imgPlaceholderIcon').style.display = '';
  $('imgPlaceholderText').style.display = '';
  openModal('itemModal');
  setTimeout(() => $('fName').focus(), 50);
}

function openEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id; imgData = item.img || null;
  $('itemModalTitle').textContent = 'Item bewerken';
  $('fName').value = item.name; $('fNote').value = item.note||'';
  $('fLoc').value = item.loc;   $('fCat').value = item.cat;
  if (item.img) {
    $('imgPreviewImg').src = item.img; $('imgPreviewImg').style.display = 'block';
    $('imgPlaceholderIcon').style.display = 'none'; $('imgPlaceholderText').style.display = 'none';
  } else {
    $('imgPreviewImg').style.display = 'none';
    $('imgPlaceholderIcon').style.display = ''; $('imgPlaceholderText').style.display = '';
  }
  openModal('itemModal');
}

function saveItem() {
  const name = $('fName').value.trim();
  if (!name) { $('fName').focus(); return; }
  const item = { id: editingId||uid(), name, loc:$('fLoc').value, cat:$('fCat').value, note:$('fNote').value.trim(), img:imgData||null };
  if (editingId) items[items.findIndex(i=>i.id===editingId)] = item;
  else items.unshift(item);
  save(); closeModal('itemModal'); render();
}

$('fImg').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    imgData = ev.target.result;
    $('imgPreviewImg').src = imgData; $('imgPreviewImg').style.display = 'block';
    $('imgPlaceholderIcon').style.display = 'none'; $('imgPlaceholderText').style.display = 'none';
  };
  r.readAsDataURL(file);
});

// ── DELETE ──
function openDelete(id) {
  deletingId = id;
  $('deleteItemName').textContent = items.find(i=>i.id===id)?.name || 'dit item';
  openModal('deleteModal');
}
function confirmDelete() {
  items    = items.filter(i=>i.id!==deletingId);
  packList = packList.filter(i=>i!==deletingId);
  save(); closeModal('deleteModal'); render();
}

// ── PACKING LIST ──
function togglePack(id) {
  packList = packList.includes(id) ? packList.filter(x=>x!==id) : [...packList, id];
  save(); render();
}

function renderPackModal() {
  const list = $('packList');
  if (!packList.length) {
    list.innerHTML = `<p style="color:var(--text-muted);font-size:.9rem;text-align:center;padding:1rem">Geen items op de inpaklijst.</p>`;
    return;
  }
  list.innerHTML = packList.map(id => {
    const item = items.find(i=>i.id===id); if (!item) return '';
    const catIconName = CAT_ICONS[item.cat]||'box';
    return `<div class="pack-item">
      <span class="pack-item-icon">${ICONS[catIconName]||ICONS.box}</span>
      <span class="pack-item-name">${item.name}</span>
      <span class="pack-item-loc">${locName(item.loc)}</span>
      <button class="icon-btn" title="Verwijderen uit lijst" onclick="togglePack('${item.id}');renderPackModal()">${ICONS.close}</button>
    </div>`;
  }).join('');
}

function clearPack() { packList=[]; save(); render(); closeModal('packModal'); }

// ── SETTINGS ──
function openSettings() { $('sLocA').value=settings.locA; $('sLocB').value=settings.locB; openModal('settingsModal'); }
function saveSettings() {
  settings.locA = $('sLocA').value.trim()||'Papa';
  settings.locB = $('sLocB').value.trim()||'Mama';
  save(); closeModal('settingsModal'); render();
}

// ── EVENTS ──
$('openAddBtn').addEventListener('click', openAdd);
$('openSettingsBtn').addEventListener('click', openSettings);
['openPackingBtn','openPackingBtn2'].forEach(id => $(id).addEventListener('click', () => { renderPackModal(); openModal('packModal'); }));

$('itemModalClose').addEventListener('click',    ()=>closeModal('itemModal'));
$('itemModalCancel').addEventListener('click',   ()=>closeModal('itemModal'));
$('itemModalSave').addEventListener('click',     saveItem);
$('fName').addEventListener('keydown', e=>{ if(e.key==='Enter') saveItem(); });

$('deleteModalClose').addEventListener('click',  ()=>closeModal('deleteModal'));
$('deleteCancelBtn').addEventListener('click',   ()=>closeModal('deleteModal'));
$('deleteConfirmBtn').addEventListener('click',  confirmDelete);

$('packModalClose').addEventListener('click',    ()=>closeModal('packModal'));
$('packModalClose2').addEventListener('click',   ()=>closeModal('packModal'));
['clearPackBtn','clearPackBtn2'].forEach(id=>$(id).addEventListener('click', clearPack));

$('settingsModalClose').addEventListener('click',()=>closeModal('settingsModal'));
$('settingsCancel').addEventListener('click',    ()=>closeModal('settingsModal'));
$('settingsSave').addEventListener('click',      saveSettings);

$('searchInput').addEventListener('input',  render);
$('filterLoc').addEventListener('change',   render);
$('filterCat').addEventListener('change',   render);

render();
</script>
</body>
</html>
