<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhereIsIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-logo">Where<span>Is</span>It</div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="openPackingBtn">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
      Inpaklijst <span class="pack-count" id="packCount">0</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="openSettingsBtn" title="Instellingen">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      Instellingen
    </button>
    <button class="btn btn-primary btn-sm" id="openAddBtn">
      <span class="ic"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      Item
    </button>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input class="search-input" id="searchInput" type="search" placeholder="Zoek een item..." />
  </div>
  <select class="filter-select" id="filterLoc"></select>
  <select class="filter-select" id="filterCat"></select>
  <div class="sort-wrap">
    <button class="btn btn-ghost btn-sm" id="sortBtn">
      <span class="ic"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/></svg></span>
      <span id="sortLabel">Naam</span>
      <span id="sortDir"></span>
    </button>
    <div class="sort-dropdown" id="sortDropdown">
      <div id="sortMenu"></div>
    </div>
  </div>
</div>

<!-- PACK BANNER -->
<div class="pack-banner" id="packBanner" style="display:none">
  <span class="pack-banner-title">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
    Inpaklijst actief
  </span>
  <div style="display:flex;gap:.5rem">
    <button class="btn btn-ghost btn-sm" id="openPackingBtn2">Bekijken</button>
    <button class="btn btn-ghost btn-sm" id="clearPackBannerBtn">Leegmaken</button>
  </div>
</div>

<!-- ITEM GRID -->
<div class="grid" id="itemGrid"></div>

<!-- MODAL: ITEM TOEVOEGEN / BEWERKEN -->
<div class="modal-backdrop" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="itemModalTitle">Item toevoegen</span>
      <button class="modal-close" id="itemModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="form-group">
      <label class="form-label">Naam</label>
      <input class="form-input" id="fName" placeholder="Bijv. Voetbalschoenen" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Locatie</label>
        <select class="form-select" id="fLoc"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Categorie</label>
        <select class="form-select" id="fCat"></select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notitie (optioneel)</label>
      <textarea class="form-textarea" id="fNote" placeholder="Extra informatie..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Foto (optioneel)</label>
      <div class="img-preview" id="imgPreview">
        <svg id="imgPlaceholderIcon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span id="imgPlaceholderText">Klik om foto toe te voegen</span>
        <img id="imgPreviewImg" src="" style="display:none" alt="preview" />
        <input type="file" accept="image/*" id="fImg" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="itemModalCancel">Annuleren</button>
      <button class="btn btn-primary" id="itemModalSave">Opslaan</button>
    </div>
  </div>
</div>

<!-- MODAL: VERWIJDER BEVESTIGING -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <span class="modal-title">Item verwijderen</span>
      <button class="modal-close" id="deleteModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:.9rem;color:var(--text-muted)">Weet je zeker dat je <strong id="deleteItemName"></strong> wil verwijderen? Dit kan niet ongedaan worden gemaakt.</p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="deleteCancelBtn">Annuleren</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">Verwijderen</button>
    </div>
  </div>
</div>

<!-- MODAL: INPAKLIJST -->
<div class="modal-backdrop" id="packModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Inpaklijst</span>
      <button class="modal-close" id="packModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="font-size:.85rem;color:var(--text-muted)">Items die je wil meenemen bij je volgende verhuizing.</p>
    <div class="pack-list" id="packList"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="clearPackBtn">Lijst leegmaken</button>
      <button class="btn btn-primary" id="packModalClose2">Sluiten</button>
    </div>
  </div>
</div>

<!-- MODAL: GESCHIEDENIS -->
<div class="modal-backdrop" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Geschiedenis — <span id="historyItemName"></span></span>
      <button class="modal-close" id="historyModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="historyModalClose2">Sluiten</button>
    </div>
  </div>
</div>

<!-- MODAL: INSTELLINGEN -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title">Instellingen</span>
      <button class="modal-close" id="settingsModalClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <!-- Locaties -->
    <div class="settings-section">
      <div class="modal-section-title">Locaties</div>
      <div id="locationsList"></div>
      <div class="settings-add-row">
        <input class="form-input" id="newLocationName" placeholder="Nieuwe locatie..." />
        <button class="btn btn-primary btn-sm" id="addLocationBtn">
          <span class="ic"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          Toevoegen
        </button>
      </div>
    </div>

    <!-- Categorieën -->
    <div class="settings-section">
      <div class="modal-section-title">Categorieën</div>
      <div id="categoriesList"></div>
      <div class="settings-add-row">
        <input class="form-input" id="newCategoryName" placeholder="Nieuwe categorie..." />
        <button class="btn btn-primary btn-sm" id="addCategoryBtn">
          <span class="ic"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          Toevoegen
        </button>
      </div>
    </div>

    <!-- Im-/export -->
    <div class="settings-section">
      <div class="modal-section-title">Im-/export</div>
      <div class="export-row">
        <button class="btn btn-ghost btn-sm" id="exportJsonBtn">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
          Exporteer JSON
        </button>
        <button class="btn btn-ghost btn-sm" id="exportCsvBtn">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
          Exporteer CSV
        </button>
        <button class="btn btn-ghost btn-sm" id="importJsonBtn">
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
          Importeer JSON
        </button>
        <input type="file" id="importJsonFile" accept=".json" style="display:none" />
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" id="settingsClose">Sluiten</button>
    </div>
  </div>
</div>

<!-- JS: volgorde is belangrijk, afhankelijkheden eerst -->
<script src="js/storage.js"></script>
<script src="js/locations.js"></script>
<script src="js/categories.js"></script>
<script src="js/items.js"></script>
<script src="js/packlist.js"></script>
<script src="js/importexport.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
